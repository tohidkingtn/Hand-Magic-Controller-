<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MR Tohid's AI Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Puter.js Load kar rahe hain (No API Key Required) -->
  <script src="https://js.puter.com/v2/"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

  <div class="w-full max-w-lg bg-slate-800 rounded-2xl shadow-xl flex flex-col h-[85vh] border border-slate-700">
    <!-- Header -->
    <div class="p-4 border-b border-slate-700 text-center font-bold text-xl text-amber-400 flex items-center justify-center gap-2">
      🤖 MR Tohid's AI Assistant
    </div>

    <!-- Chat Messages Container -->
    <div id="chat-box" class="flex-1 p-4 overflow-y-auto space-y-3">
      <div class="bg-slate-700 text-slate-200 p-3 rounded-xl max-w-[80%] self-start">
        Namaste! Main **MR Tohid** ka Personal AI Assistant hoon. Ab yahan koi API key ki zarurat nahi hai, seedha baat karo!
      </div>
    </div>

    <!-- Input Box -->
    <div class="p-4 border-t border-slate-700 flex gap-2">
      <input type="text" id="user-input" placeholder="Tohid ke baare me ya kuch bhi poochein..." 
             class="flex-1 bg-slate-900 text-white px-4 py-2 rounded-xl outline-none border border-slate-700 focus:border-amber-400">
      <button onclick="sendMessage()" 
              class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold px-5 py-2 rounded-xl transition">
        Send
      </button>
    </div>
  </div>

  <script>
    const systemPrompt = `
    Tum MR Tohid ke dwara banaye gaye AI Assistant ho. 
    Jab bhi koi user Tohid ya MR Tohid ke baare mein pooche, toh unhe ye baatein batana:
    - Tohid ek passionate creator aur tech/gaming enthusiast hain (jinke screen name MR Tohid hai).
    - Unhe PUBG gaming, high-end photography/editing, aur Royal Enfield (Bullet/GT 650) & KTM bikes ka bohot shauk hai.
    - Wo coding aur smart web tools banane me interest rakhte hain.
    - Unka attitude bohot helpful aur creative hai.
    - Hamesha respectful, friendly aur thoda stylish tone me jawab do (Hindi/Hinglish me).
    `;

    async function sendMessage() {
      const inputEl = document.getElementById('user-input');
      const chatBox = document.getElementById('chat-box');
      const userText = inputEl.value.trim();

      if (!userText) return;

      // User Message UI
      chatBox.innerHTML += `<div class="bg-amber-500 text-slate-900 font-medium p-3 rounded-xl max-w-[80%] ml-auto">${userText}</div>`;
      inputEl.value = '';
.      chatBox.scrollTop = chatBox.scrollHeight;

      // Loading Indicator
      const loadingId = "loading-" + Date.now();
      chatBox.innerHTML += `<div id="${loadingId}" class="bg-slate-700 text-slate-400 p-3 rounded-xl max-w-[80%] italic">Soch raha hoon...</div>`;
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        // Combining system prompt and user text for the chat call
        const fullPrompt = `${systemPrompt}\n\nUser: ${userText}`;
        
        // Puter AI Call (No keys needed)
        puter.ai.chat(fullPrompt)
          .then(response => {
            let reply = "";
            if (typeof response === 'string') {
              reply = response;
            } else if (response && response.message) {
              reply = response.message.content || response.message;
            } else {
              reply = JSON.stringify(response);
            }
            document.getElementById(loadingId).outerHTML = `<div class="bg-slate-700 text-slate-100 p-3 rounded-xl max-w-[80%]">${reply}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
          })
          .catch(err => {
            document.getElementById(loadingId).outerHTML = `<div class="bg-red-500/20 text-red-300 p-3 rounded-xl max-w-[80%]">Error: ${err.message || err}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
          });

      } catch (error) {
        document.getElementById(loadingId).outerHTML = `<div class="bg-red-500/20 text-red-300 p-3 rounded-xl max-w-[80%]">Error: ${error.message}</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    }

    document.getElementById("user-input").addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });
  </script>
</body>
</html>
