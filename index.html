<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LuxeStore | Premium Shopping Experience</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #10b981;
      --danger: #ef4444;
      --border: #334155;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Navbar */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(16px);
      background: rgba(15, 23, 42, 0.85);
      border-bottom: 1px solid var(--border);
    }

    .navbar {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
    }

    .logo {
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(135deg, #a5b4fc, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .search-box {
      flex: 1;
      max-width: 500px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 0.7rem 1rem 0.7rem 2.8rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 9999px;
      color: var(--text);
      outline: none;
      transition: 0.3s;
    }

    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 10px rgba(99, 102, 241, 0.3);
    }

    .search-box i {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .cart-btn {
      position: relative;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border: none;
      color: #fff;
      padding: 0.7rem 1.4rem;
      border-radius: 9999px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: 0.3s;
    }

    .cart-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
    }

    .cart-badge {
      background: var(--accent);
      color: #fff;
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
      border-radius: 9999px;
      font-weight: bold;
    }

    /* Categories Bar */
    .categories {
      display: flex;
      gap: 0.8rem;
      overflow-x: auto;
      padding: 1rem 2rem;
      max-width: 1400px;
      margin: 0 auto;
      scrollbar-width: none;
    }

    .categories::-webkit-scrollbar {
      display: none;
    }

    .cat-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.5rem 1.2rem;
      border-radius: 9999px;
      cursor: pointer;
      white-space: nowrap;
      transition: 0.3s;
      font-size: 0.9rem;
    }

    .cat-btn.active, .cat-btn:hover {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    /* Main Container */
    main {
      flex: 1;
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
      width: 100%;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.5rem;
    }

    /* Product Card */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      transition: transform 0.3s, border-color 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: var(--primary);
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 0.75rem;
      background: #0b0f19;
    }

    .card-body {
      margin-top: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .tag {
      font-size: 0.75rem;
      color: var(--primary);
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .title {
      font-size: 1rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .price-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.5rem;
    }

    .price {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent);
    }

    .add-btn {
      background: rgba(99, 102, 241, 0.15);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.3);
      padding: 0.5rem 0.8rem;
      border-radius: 0.5rem;
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s;
    }

    .add-btn:hover {
      background: var(--primary);
      color: white;
    }

    /* Cart Drawer */
    .drawer-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: none;
    }

    .drawer {
      position: fixed;
      top: 0; right: -420px;
      width: 100%;
      max-width: 400px;
      height: 100%;
      background: var(--card-bg);
      z-index: 101;
      box-shadow: -5px 0 25px rgba(0,0,0,0.5);
      transition: right 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .drawer.open { right: 0; }
    .drawer-overlay.open { display: block; }

    .drawer-header {
      padding: 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .drawer-items {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .cart-item {
      display: flex;
      gap: 1rem;
      background: var(--bg);
      padding: 0.75rem;
      border-radius: 0.5rem;
      align-items: center;
    }

    .cart-item img {
      width: 50px;
      height: 50px;
      border-radius: 0.25rem;
      object-fit: cover;
    }

    .cart-item-info {
      flex: 1;
    }

    .cart-item-title {
      font-size: 0.85rem;
      font-weight: 600;
    }

    .cart-item-price {
      color: var(--accent);
      font-size: 0.85rem;
    }

    .drawer-footer {
      padding: 1.5rem;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .checkout-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 1rem;
      border-radius: 0.5rem;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      transition: 0.2s;
    }

    .checkout-btn:hover { filter: brightness(1.1); }

    /* Checkout Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 1rem;
    }

    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1rem;
      width: 100%;
      max-width: 550px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 2rem;
    }

    .modal h2 { margin-bottom: 1rem; font-size: 1.3rem; }
    
    .form-group {
      margin-bottom: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .form-group label {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .form-group input, .form-group textarea, .form-group select {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 0.6rem 0.8rem;
      border-radius: 0.4rem;
      color: #fff;
      outline: none;
    }

    .payment-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      margin: 1rem 0;
    }

    .payment-option {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 0.75rem;
      border-radius: 0.5rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
    }

    .payment-option input { margin-right: 0.3rem; }
  </style>
</head>
<body>

  <!-- Navigation -->
  <header>
    <div class="navbar">
      <a href="#" class="logo"><i class="fa-solid fa-cube"></i> LuxeStore</a>
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Search 200+ products..." oninput="filterProducts()">
      </div>
      <button class="cart-btn" onclick="toggleCart()">
        <i class="fa-solid fa-bag-shopping"></i>
        <span class="cart-badge" id="cartCount">0</span>
      </button>
    </div>
  </header>

  <!-- Categories -->
  <div class="categories" id="categoryContainer"></div>

  <!-- Products Main View -->
  <main>
    <div class="grid-container" id="productGrid"></div>
  </main>

  <!-- Cart Drawer -->
  <div class="drawer-overlay" id="drawerOverlay" onclick="toggleCart()"></div>
  <div class="drawer" id="cartDrawer">
    <div class="drawer-header">
      <h3>Your Shopping Cart</h3>
      <i class="fa-solid fa-xmark" style="cursor: pointer; font-size: 1.2rem;" onclick="toggleCart()"></i>
    </div>
    <div class="drawer-items" id="cartItems"></div>
    <div class="drawer-footer">
      <div style="display:flex; justify-content:space-between; font-weight:700;">
        <span>Total:</span>
        <span id="cartTotal">₹0</span>
      </div>
      <button class="checkout-btn" onclick="openCheckout()">Proceed to Checkout</button>
    </div>
  </div>

  <!-- Checkout Modal -->
  <div class="modal-overlay" id="checkoutModal">
    <div class="modal">
      <h2>Complete Delivery Details</h2>
      <form id="orderForm" onsubmit="handlePlaceOrder(event)">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" required placeholder="John Doe">
        </div>
        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" required placeholder="+91 98765 43210">
        </div>
        <div class="form-group">
          <label>Complete Shipping Address</label>
          <textarea rows="2" required placeholder="House No, Street, City, Pincode"></textarea>
        </div>

        <h3 style="margin-top: 1.2rem; font-size: 1.1rem;">Select Payment Mode</h3>
        <div class="payment-options">
          <label class="payment-option">
            <input type="radio" name="payment" value="Online - UPI" checked>
            <span><i class="fa-solid fa-mobile-screen"></i> UPI / QR</span>
          </label>
          <label class="payment-option">
            <input type="radio" name="payment" value="Credit / Debit Card">
            <span><i class="fa-solid fa-credit-card"></i> Cards</span>
          </label>
          <label class="payment-option">
            <input type="radio" name="payment" value="Net Banking">
            <span><i class="fa-solid fa-building-columns"></i> Net Banking</span>
          </label>
          <label class="payment-option">
            <input type="radio" name="payment" value="Cash On Delivery">
            <span><i class="fa-solid fa-money-bill-wave"></i> COD</span>
          </label>
        </div>

        <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
          <button type="button" class="add-btn" style="flex:1;" onclick="closeCheckout()">Cancel</button>
          <button type="submit" class="checkout-btn" style="flex:2;">Confirm & Place Order</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // 1. Setup Categories & 210 Products Generator
    const categories = [
      { name: "All", id: "all" },
      { name: "Headphones", id: "headphones", img: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=300" },
      { name: "Earbuds", id: "earbuds", img: "https://images.unsplash.com/photo-1590658268037-6bf12165a8df?w=300" },
      { name: "Mobiles", id: "mobiles", img: "https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=300" },
      { name: "Jeans", id: "jeans", img: "https://images.unsplash.com/photo-1542272604-787c3835535d?w=300" },
      { name: "Shirts", id: "shirts", img: "https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf?w=300" },
      { name: "Ladies Wear", id: "ladies", img: "https://images.unsplash.com/photo-1525507119028-ed4c629a60a3?w=300" },
      { name: "Gents Wear", id: "gents", img: "https://images.unsplash.com/photo-1617137984095-74e4e5e3613f?w=300" }
    ];

    const products = [];
    let idCounter = 1;

    // Generate 30 items per category (7 categories * 30 = 210 items total)
    categories.slice(1).forEach(cat => {
      for(let i = 1; i <= 30; i++) {
        products.push({
          id: idCounter++,
          category: cat.id,
          name: `${cat.name} Edition ${i}`,
          price: Math.floor(Math.random() * 4000) + 499,
          image: cat.img
        });
      }
    });

    let cart = [];
    let activeCategory = 'all';

    // 2. Render Categories
    const categoryContainer = document.getElementById('categoryContainer');
    categories.forEach(cat => {
      const btn = document.createElement('button');
      btn.className = `cat-btn ${cat.id === 'all' ? 'active' : ''}`;
      btn.innerText = cat.name;
      btn.onclick = () => selectCategory(cat.id, btn);
      categoryContainer.appendChild(btn);
    });

    function selectCategory(catId, element) {
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      element.classList.add('active');
      activeCategory = catId;
      filterProducts();
    }

    // 3. Render Products
    function renderProducts(list) {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = '';
      if(list.length === 0) {
        grid.innerHTML = '<p style="color:var(--text-muted); grid-column: 1/-1;">No matching products found.</p>';
        return;
      }
      list.forEach(p => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="${p.image}" alt="${p.name}" loading="lazy">
          <div class="card-body">
            <span class="tag">${p.category}</span>
            <div class="title">${p.name}</div>
            <div class="price-row">
              <span class="price">₹${p.price}</span>
              <button class="add-btn" onclick="addToCart(${p.id})">+ Add</button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Filter Logic
    function filterProducts() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = products.filter(p => {
        const matchesCategory = (activeCategory === 'all' || p.category === activeCategory);
        const matchesSearch = p.name.toLowerCase().includes(query);
        return matchesCategory && matchesSearch;
      });
      renderProducts(filtered);
    }

    // 4. Cart Logic
    function toggleCart() {
      document.getElementById('cartDrawer').classList.toggle('open');
      document.getElementById('drawerOverlay').classList.toggle('open');
    }

    function addToCart(productId) {
      const item = products.find(p => p.id === productId);
      cart.push(item);
      updateCart();
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      updateCart();
    }

    function updateCart() {
      document.getElementById('cartCount').innerText = cart.length;
      const cartContainer = document.getElementById('cartItems');
      cartContainer.innerHTML = '';
      let total = 0;

      cart.forEach((item, index) => {
        total += item.price;
        const div = document.createElement('div');
        div.className = 'cart-item';
        div.innerHTML = `
          <img src="${item.image}">
          <div class="cart-item-info">
            <div class="cart-item-title">${item.name}</div>
            <div class="cart-item-price">₹${item.price}</div>
          </div>
          <i class="fa-solid fa-trash" style="cursor:pointer; color:var(--danger);" onclick="removeFromCart(${index})"></i>
        `;
        cartContainer.appendChild(div);
      });

      document.getElementById('cartTotal').innerText = `₹${total}`;
    }

    // 5. Checkout & Order Processing
    function openCheckout() {
      if(cart.length === 0) {
        alert("Aapka cart khali hai!");
        return;
      }
      toggleCart();
      document.getElementById('checkoutModal').classList.add('open');
    }

    function closeCheckout() {
      document.getElementById('checkoutModal').classList.remove('open');
    }

    function handlePlaceOrder(e) {
      e.preventDefault();
      const payMethod = document.querySelector('input[name="payment"]:checked').value;
      alert(`Success! Order placed successfully via [${payMethod}]. Total Items: ${cart.length}`);
      cart = [];
      updateCart();
      closeCheckout();
    }

    // Initial Render
    renderProducts(products);
  </script>
</body>
  </html>
