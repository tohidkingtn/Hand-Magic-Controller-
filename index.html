<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MR Tohid's AI Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

  <div class="w-full max-w-lg bg-slate-800 rounded-2xl shadow-xl flex flex-col h-[85vh] border border-slate-700">
    <!-- Header -->
    <div class="p-4 border-b border-slate-700 text-center font-bold text-xl text-amber-400 flex items-center justify-center gap-2">
      🤖 MR Tohid's AI Assistant
    </div>

    <!-- Chat Messages Container -->
    <div id="chat-box" class="flex-1 p-4 overflow-y-auto space-y-3">
      <div class="bg-slate-700 text-slate-200 p-3 rounded-xl max-w-[80%] self-start">
        Namaste! Main **MR Tohid** ka Personal AI Assistant hoon. Ab bina kisi API Key ya limit ke mujhse kuch bhi poochein!
      </div>
    </div>

    <!-- Input Box -->
    <div class="p-4 border-t border-slate-700 flex gap-2">
      <input type="text" id="user-input" placeholder="Tohid ke baare me ya kuch bhi poochein..." 
             class="flex-1 bg-slate-900 text-white px-4 py-2 rounded-xl outline-none border border-slate-700 focus:border-amber-400">
      <button onclick="sendMessage()" 
              class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold px-5 py-2 rounded-xl transition">
        Send
      </button>
    </div>
  </div>

  <script>
    const systemPrompt = "Tum MR Tohid ke dwara banaye gaye AI Assistant ho. Tohid ek passionate creator, tech/gaming enthusiast hain (PUBG, photography, Royal Enfield, KTM bikes). Unka nature helpful aur creative hai. Hamesha friendly aur Hinglish me short & cool jawab do.";

    async function sendMessage() {
      const inputEl = document.getElementById('user-input');
      const chatBox = document.getElementById('chat-box');
      const userText = inputEl.value.trim();

      if (!userText) return;

      // User Message UI
      chatBox.innerHTML += `<div class="bg-amber-500 text-slate-900 font-medium p-3 rounded-xl max-w-[80%] ml-auto">${userText}</div>`;
      inputEl.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;

      // Loading Indicator
      const loadingId = "loading-" + Date.now();
      chatBox.innerHTML += `<div id="${loadingId}" class="bg-slate-700 text-slate-400 p-3 rounded-xl max-w-[80%] italic">Soch raha hoon...</div>`;
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        // Complete Prompt Formatting
        const fullQuery = `${systemPrompt}\nUser Question: ${userText}`;
        const encodedQuery = encodeURIComponent(fullQuery);

        // Free Direct GET Request (No key, No header issues)
        const response = await fetch(`https://text.pollinations.ai/${encodedQuery}?model=openai&seed=${Math.floor(Math.random() * 1000)}`);

        if (!response.ok) {
          throw new Error("Server Response Error");
        }

        const reply = await response.text();

        document.getElementById(loadingId).outerHTML = `<div class="bg-slate-700 text-slate-100 p-3 rounded-xl max-w-[80%]">${reply}</div>`;

      } catch (error) {
        document.getElementById(loadingId).outerHTML = `<div class="bg-red-500/20 text-red-300 p-3 rounded-xl max-w-[80%]">Error: Connection nahi ho pa raha hai, dobara try karein.</div>`;
      }

      chatBox.scrollTop = chatBox.scrollHeight;
    }

    document.getElementById("user-input").addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });
  </script>
</body>
</html>
